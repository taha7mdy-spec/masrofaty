<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10a874">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>مصروفاتي</title>
<style>
:root{--bg:#f4f5f4;--card:#fff;--tx:#1b1d1c;--mut:#6b7270;--ac:#10a874;--red:#d9534f;--bd:#e3e6e4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1f201f;--card:#2b2c2b;--tx:#f1f3f2;--mut:#9aa19e;--bd:#3a3c3b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--bd)}
h2{font-size:15px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.big{font-size:30px;font-weight:700}
.in{color:var(--ac);font-weight:700;font-size:20px}
.mut{color:var(--mut);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%}
textarea{min-height:70px;resize:vertical}
button{background:var(--ac);color:#fff;border:0;font-weight:700;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.x{width:auto;background:none;color:var(--red);padding:4px 8px}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.bar i.o{background:var(--red)}
.tx{padding:10px 0;border-top:1px solid var(--bd)}
.tx:first-child{border-top:0}
.amt{font-weight:700;white-space:nowrap}
.cat{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.stack>*{margin-bottom:8px}
details summary{cursor:pointer;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <div class="row sp"><b id="mon"></b><span style="display:flex;gap:6px"><button class="g" style="width:auto" onclick="mv(-1)">‹</button><button class="g" style="width:auto" onclick="mv(1)">›</button></span></div>
  <div class="row sp" style="margin-top:12px">
    <div><div class="big" id="exp">0</div><div class="mut">المصروفات</div></div>
    <div><div class="in" id="inc">0</div><div class="mut">الدخل</div></div>
  </div>
  <div class="mut" style="margin-top:12px" id="bl"></div>
  <div class="bar"><i id="bb" style="width:0"></i></div>
  <div class="row" style="margin-top:10px"><input id="bud" type="number" inputmode="decimal" placeholder="حدد ميزانية شهرية"><button style="width:auto" onclick="setBud()">حفظ</button></div>
</div>

<div class="card stack">
  <h2>الصق رسالة البنك</h2>
  <textarea id="sms" placeholder="الصق رسالة الـ SMS هنا…"></textarea>
  <button onclick="doSms()">تحليل وإضافة</button>
  <div class="mut" id="msg"></div>
</div>

<div class="card stack">
  <h2>إضافة يدوية</h2>
  <div class="row"><input id="a" type="number" inputmode="decimal" placeholder="المبلغ"><select id="t" style="width:110px"><option value="e">مصروف</option><option value="i">دخل</option></select></div>
  <div class="row"><input id="n" placeholder="الوصف"><select id="c"></select></div>
  <button onclick="addManual()">إضافة</button>
</div>

<div class="card"><h2>حسب التصنيف</h2><div id="cats"></div></div>
<div class="card"><h2>المعاملات</h2><div id="list"></div></div>

<div class="card stack">
  <details id="gd">
    <summary>المزامنة مع Google Drive</summary>
    <div class="stack" style="margin-top:10px">
      <input id="cid" placeholder="Client ID" dir="ltr">
      <button onclick="saveCid()">حفظ الـ Client ID</button>
      <button onclick="sync(true)">مزامنة الآن</button>
    </div>
  </details>
  <div class="mut" id="st">البيانات محفوظة على هذا الجهاز.</div>
</div>

<div class="card row">
  <button class="g" onclick="exp_()">تصدير نسخة احتياطية</button>
  <button class="g" onclick="document.getElementById('f').click()">استرجاع</button>
  <input id="f" type="file" accept=".json" hidden onchange="imp(event)">
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var CATS=["أكل","مواصلات","فواتير","تسوق","صحة","ترفيه","تحويلات","أخرى"];
var KW={"أكل":/مطعم|كافيه|cafe|coffee|food|talabat|طلبات|elmenus|carrefour|كارفور|سوبر|market|بقالة|mcdonald|kfc/i,"مواصلات":/uber|careem|كريم|اوبر|بنزين|petrol|وقود|مترو|indrive/i,"فواتير":/فاتورة|bill|fawry|فوري|vodafone|orange|etisalat|فودافون|اتصالات|كهرباء|غاز|مياه|انترنت/i,"تسوق":/amazon|noon|jumia|mall|مول|متجر|store|shop/i,"صحة":/صيدلية|pharmacy|مستشفى|clinic|عيادة|دكتور|وصفة/i,"ترفيه":/netflix|spotify|cinema|سينما|youtube|shahid|game/i,"تحويلات":/تحويل|transfer|instapay|انستاباي/i};
var S={tx:[],del:[],bud:0,bts:0},cur=new Date();cur.setDate(1);
var CID="",tok=null,tokExp=0,tc=null,timer=null;
try{var r=localStorage.getItem("masrofaty");if(r)S=Object.assign(S,JSON.parse(r));CID=localStorage.getItem("mcid")||""}catch(e){}
function $(i){return document.getElementById(i)}
function fmt(n){return Number(n).toLocaleString("ar-EG",{maximumFractionDigits:2})}
function key(d){return d.getFullYear()+"-"+d.getMonth()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stat(t){$("st").textContent=t}
function save(){try{localStorage.setItem("masrofaty",JSON.stringify(S))}catch(e){}
  if(tok&&Date.now()<tokExp){clearTimeout(timer);timer=setTimeout(function(){sync(false)},1500)}}
function mv(k){cur.setMonth(cur.getMonth()+k);render()}
function setBud(){S.bud=parseFloat($("bud").value)||0;S.bts=Date.now();save();render()}
function guess(s){for(var k in KW)if(KW[k].test(s))return k;return "أخرى"}
function add(o){o.u=Date.now();S.tx.unshift(o);save();render()}
function addManual(){var a=parseFloat($("a").value);if(!a)return;var n=$("n").value.trim();add({id:Date.now(),amt:a,type:$("t").value,note:n||$("c").value,cat:$("c").value,d:Date.now()});$("a").value="";$("n").value=""}
function parseText(t){
  var x=t.match(/(?:EGP|LE|L\.E|جنيه|ج\.م|مبلغ|بمبلغ)\s*:?\s*([\d,]+(?:\.\d+)?)/i)||t.match(/([\d,]+(?:\.\d+)?)\s*(?:EGP|LE|جنيه|ج\.م)/i);
  if(!x)return "ما قدرتش ألاقي مبلغ في الرسالة. جرّب الإضافة اليدوية.";
  var amt=parseFloat(x[1].replace(/,/g,""));
  var inc=/إيداع|ايداع|استلام|وارد|credited|received|deposit|salary|راتب|refund|استرداد/i.test(t);
  var mm=t.match(/(?:^|\s)(?:at|لدى|عند)\s+(.+?)(?=\s+(?:on|في|بتاريخ)\s+\d|[.,،\n]|$)/i);
  var note=mm?mm[1].trim().slice(0,40):t.replace(/\s+/g," ").slice(0,30);
  var dt=Date.now(),dm=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(?:at\s+|في\s+)?(\d{1,2}):(\d{2}))?/);
  if(dm&&+dm[2]<=12){var yy=+dm[3];if(yy<100)yy+=2000;var z=new Date(yy,+dm[2]-1,+dm[1],+(dm[4]||12),+(dm[5]||0));if(!isNaN(z))dt=z.getTime()}
  add({id:Date.now(),amt:amt,type:inc?"i":"e",note:note,cat:inc?"أخرى":guess(mm?note:t),d:dt});
  return "تمت إضافة "+fmt(amt)+(inc?" كدخل":" كمصروف")+". راجعه في القايمة.";
}
function doSms(){$("msg").textContent=parseText($("sms").value);$("sms").value=""}
function del(id){S.tx=S.tx.filter(function(t){return t.id!==id});S.del.push(id);save();render()}
function recat(id,c){S.tx.forEach(function(t){if(t.id===id){t.cat=c;t.u=Date.now()}});save();render()}
function render(){
  $("mon").textContent=cur.toLocaleDateString("ar-EG",{month:"long",year:"numeric"});
  var k=key(cur),L=S.tx.filter(function(t){return key(new Date(t.d))===k}),e=0,i=0,bc={};
  L.forEach(function(t){if(t.type==="e"){e+=t.amt;bc[t.cat]=(bc[t.cat]||0)+t.amt}else i+=t.amt});
  $("exp").textContent=fmt(e);$("inc").textContent=fmt(i);
  var b=S.bud;$("bud").placeholder=b?"الميزانية الحالية: "+fmt(b):"حدد ميزانية شهرية";
  $("bl").textContent=b?"المتبقي من الميزانية: "+fmt(b-e):"";
  var p=b?Math.min(100,e/b*100):0;$("bb").style.width=p+"%";$("bb").className=b&&e>b?"o":"";
  var ch="";Object.keys(bc).sort(function(a,c){return bc[c]-bc[a]}).forEach(function(c){ch+='<div class="cat"><span>'+c+'</span><b>'+fmt(bc[c])+'</b></div>'});
  $("cats").innerHTML=ch||'<div class="mut">لا توجد بيانات.</div>';
  var h="";L.sort(function(a,c){return c.d-a.d}).forEach(function(t){
    var o=CATS.map(function(c){return '<option'+(c===t.cat?' selected':'')+'>'+c+'</option>'}).join("");
    h+='<div class="tx"><div class="row sp"><span>'+esc(t.note)+'</span><span class="amt" style="color:'+(t.type==="i"?'var(--ac)':'inherit')+'">'+(t.type==="i"?"+":"−")+fmt(t.amt)+'</span></div><div class="row sp" style="margin-top:6px"><select style="width:auto;padding:4px 8px" onchange="recat('+t.id+',this.value)">'+o+'</select><span class="mut">'+new Date(t.d).toLocaleDateString("ar-EG")+'</span><button class="x" onclick="del('+t.id+')">حذف</button></div></div>'});
  $("list").innerHTML=h||'<div class="mut">لا توجد معاملات هذا الشهر.</div>';
}
function exp_(){var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="masrofaty-backup.json";a.click()}
function imp(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{merge(JSON.parse(r.result));save();render()}catch(e){}};r.readAsText(f)}

/* ---- Google Drive sync (hidden app folder) ---- */
function merge(r){
  var d={};(S.del||[]).concat(r.del||[]).forEach(function(id){d[id]=1});
  var m={};(S.tx||[]).concat(r.tx||[]).forEach(function(t){if(d[t.id])return;if(!m[t.id]||(t.u||0)>(m[t.id].u||0))m[t.id]=t});
  S.tx=Object.keys(m).map(function(k){return m[k]});S.del=Object.keys(d).map(Number);
  if((r.bts||0)>(S.bts||0)){S.bud=r.bud;S.bts=r.bts}
}
function saveCid(){CID=$("cid").value.trim();try{localStorage.setItem("mcid",CID)}catch(e){}tc=null;stat("تم حفظ الـ Client ID. اضغط مزامنة الآن.")}
function getToken(){return new Promise(function(res,rej){
  if(tok&&Date.now()<tokExp)return res(tok);
  if(!CID)return rej(new Error("حط الـ Client ID أولًا."));
  if(!window.google||!google.accounts)return rej(new Error("محتاج إنترنت للمزامنة."));
  if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CID,scope:"https://www.googleapis.com/auth/drive.appdata",callback:function(){}});
  tc.callback=function(r){if(r.error)return rej(new Error("تعذر تسجيل الدخول: "+r.error));tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;res(tok)};
  tc.requestAccessToken({prompt:""});
})}
async function api(url,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:"Bearer "+tok},opt.headers||{});
  var r=await fetch(url,opt);if(!r.ok)throw new Error("خطأ من Drive ("+r.status+")");return r}
async function sync(manual){
  try{
    stat("جارٍ المزامنة…");await getToken();
    var q=encodeURIComponent("name='masrofaty.json' and 'appDataFolder' in parents");
    var l=await(await api("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q="+q)).json();
    var id=l.files&&l.files[0]&&l.files[0].id;
    if(id){var rem=await(await api("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media")).json();merge(rem);try{localStorage.setItem("masrofaty",JSON.stringify(S))}catch(e){}render()}
    var body=JSON.stringify(S);
    if(id){await api("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body:body})}
    else{
      var b="mb"+Date.now(),meta=JSON.stringify({name:"masrofaty.json",parents:["appDataFolder"]});
      await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:"--"+b+"\r\nContent-Type: application/json\r\n\r\n"+meta+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--"});
    }
    stat("تمت المزامنة "+new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){stat(e.message||"فشلت المزامنة.")}
}

$("c").innerHTML=CATS.map(function(c){return "<option>"+c+"</option>"}).join("");
$("cid").value=CID;if(!CID)$("gd").open=true;
render();
var q=new URLSearchParams(location.search),sh=q.get("text")||q.get("title");
if(sh){$("msg").textContent=parseText(sh);history.replaceState(null,"",location.pathname)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
